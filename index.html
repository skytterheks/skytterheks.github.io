    <!--
  SKYTTERHEKS.COM — MAPA PARA METER GARRITA (≽^•⩊•^≼)

  ESTE ARCHIVO: textos, imágenes de tus obras, botones y redes.
  ESTILOS.CSS: colores, fuentes, fondo y tamaños.
  VENTANAS.JS: movimiento, abrir, cerrar, minimizar y formulario.
  IMAGENES/: fondo, iconos, cursor y las fotos que añadas.
  LEEME.txt: ejemplos de edición y cómo subir la carpeta completa.

  BUSCA ESTAS PALABRAS (Ctrl+F / Cmd+F en tu editor):
  EDITAR: DATOS GENERALES        correo de destino y dominio
  EDITAR: MARCA Y NOMBRE         nombre visible en el escritorio
  EDITAR: ICONOS Y BOTONES       nombres bajo los iconos
  EDITAR: INICIO                 ventana de bienvenida
  EDITAR: PORTAFOLIO             tarjetas de obras
  EDITAR: PROYECTOS              ficha del proyecto
  EDITAR: HABILIDADES            técnicas y herramientas
  EDITAR: SOBRE MI               tu WBU
  EDITAR: CV                     trayectoria
  EDITAR: CONTACTO               textos y formulario
  EDITAR: OBRA DISPONIBLE        catálogo / consultas
  EDITAR: EXPLORER Y REDES        enlaces y créditos

  Escribe dentro de <p>tu texto</p> o <h2>tu título</h2>.
  Puedes usar comillas, apóstrofes y saltos de línea normales.
  Conserva las etiquetas, los id y los atributos data-panel.

  EJEMPLO PARA UNA FOTO:
  Sustituye TODO <div class="cy-placeholder">...</div> por:
  <img class="cy-artwork" src="imagenes/mi-obra.jpg" alt="Descripción de mi obra">
  Guarda la foto en imagenes/ con exactamente ese nombre.
-->
